<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>🔊 Прочитай мне</h2>

  <button id="btn-read">▶ Прочитать (Alt+R)</button>
  <button id="btn-stop">⏹ Стоп</button>

  <label for="voice">Голос:</label>
  <select id="voice">
    <option value="">— русский по умолчанию —</option>
  </select>

  <label>Скорость: <span id="rate-value">1.0</span></label>
  <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">

  <button id="btn-save" class="secondary">💾 Сохранить текст (.txt)</button>

  <p id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
